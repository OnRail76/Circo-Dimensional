name: Publicar El Circo Dimensional v1.0
on:
  push:
    paths:
      - "CIRCO_DIMENSIONAL_EDICION_DEFINITIVA_CONTROL_POR_TOQUES_2026.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Incorporar fuentes y documentación sin cambiar el TAP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="CIRCO_DIMENSIONAL_EDICION_DEFINITIVA_CONTROL_POR_TOQUES_2026.zip"
          test -f "$ZIP" || { echo "Falta el ZIP: súbelo a la raíz del repositorio"; exit 1; }
          mkdir -p /tmp/circo-final
          unzip -q "$ZIP" -d /tmp/circo-final
          SRC="/tmp/circo-final/CIRCO_DIMENSIONAL_EDICION_DEFINITIVA_2026"
          test -f "$SRC/Juego/CIRCO_DIMENSIONAL_48K_FINAL_2026.tap"
          cmp "$SRC/Juego/CIRCO_DIMENSIONAL_48K_FINAL_2026.tap" "juego/CIRCO_DIMENSIONAL_48K_v1.0.tap"
          mkdir -p arte capturas docs fuente banco_de_trabajo
          cp -a "$SRC/Arte_original/." arte/
          cp -a "$SRC/Capturas/." capturas/
          cp -a "$SRC/Fuentes/." fuente/
          cp -a "$SRC/Banco_de_trabajo/Edicion_2026/." banco_de_trabajo/
          cp "$SRC/Manual_y_Atlas/MANUAL_CIRCO_DIMENSIONAL_EDICION_DEFINITIVA.pdf" docs/Manual_Circo_Dimensional.pdf
          cp "$SRC/Manual_y_Atlas/ATLAS_VISUAL_CIRCO_DIMENSIONAL_EDICION_DEFINITIVA.pdf" docs/Atlas_Visual_Circo_Dimensional.pdf
          cp "$SRC/MEMORIA_DE_CIERRE.txt" docs/MEMORIA_DE_CIERRE.txt
          cp "$SRC/LEEME_PRIMERO.txt" docs/LEEME_PRIMERO.txt
          sha256sum juego/CIRCO_DIMENSIONAL_48K_v1.0.tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arte capturas docs fuente banco_de_trabajo
          if ! git diff --cached --quiet; then
            git commit -m "docs: incorporar banco de trabajo, carátula, manual y atlas v1.0"
            git push origin HEAD:main
          fi

      - name: Crear o completar Release 1.0
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ZIP="CIRCO_DIMENSIONAL_EDICION_DEFINITIVA_CONTROL_POR_TOQUES_2026.zip"
          if ! gh release view v1.0 >/dev/null 2>&1; then
            gh release create v1.0 \
              --target main \
              --title "El Circo Dimensional 1.0 — Edición definitiva" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi
          gh release upload v1.0 \
            juego/CIRCO_DIMENSIONAL_48K_v1.0.tap \
            docs/Manual_Circo_Dimensional.pdf \
            docs/Atlas_Visual_Circo_Dimensional.pdf \
            "$ZIP" \
            --clobber
