# Comprueba exclusivamente la edición definitiva v1.1; sin publicación automática.
name: Verificar El Circo Dimensional v1.1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verificar-circo.yml'
      - 'banco_de_trabajo/**'
      - 'publicacion/v1_1/**'
      - 'juego/**'
      - 'fuente/**'
  pull_request:
    paths:
      - '.github/workflows/verificar-circo.yml'
      - 'banco_de_trabajo/**'
      - 'publicacion/v1_1/**'
      - 'juego/**'
      - 'fuente/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar-tap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: python3 -m pip install Pillow
      - name: Reconstruir y cotejar únicamente v1.1
        run: |
          set -euo pipefail
          python3 banco_de_trabajo/REBUILD_FINAL.py
          echo "9105d9679319aae0f4de445142276c1bfe7c65df36993e6f86ad87ddfa03dac1  juego/CIRCO_DIMENSIONAL_48K_v1.1.tap" | sha256sum -c -
