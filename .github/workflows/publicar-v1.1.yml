# La publicación v1.1 ya está cerrada. Este workflow SOLO VERIFICA.
# No escribe commits, no actualiza capturas y no reemplaza assets de Releases.
name: Verificar El Circo Dimensional (v1.0 y v1.1)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-v1.1.yml'
      - 'banco_de_trabajo/**'
      - 'publicacion/v1_1/**'
      - 'juego/**'
      - 'fuente/**'
  pull_request:
    paths:
      - '.github/workflows/publicar-v1.1.yml'
      - 'banco_de_trabajo/**'
      - 'publicacion/v1_1/**'
      - 'juego/**'
      - 'fuente/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar-taps:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Instalar dependencias de reconstrucción
        run: python3 -m pip install Pillow
      - name: Reconstruir y comparar ambos TAP
        run: |
          set -euo pipefail
          python3 banco_de_trabajo/REBUILD_FINAL.py
          echo "69f2cc4d4682eca9160595107886c0b9449b6cc745c4e2468e324b5db10f41f1  juego/CIRCO_DIMENSIONAL_48K_v1.0.tap" | sha256sum -c -
          echo "9105d9679319aae0f4de445142276c1bfe7c65df36993e6f86ad87ddfa03dac1  juego/CIRCO_DIMENSIONAL_48K_v1.1.tap" | sha256sum -c -
