name: Sincronizar licencia y notas de Release v1.0

on:
  push:
    branches:
      - main
    paths:
      - RELEASE_NOTES.md
      - LICENSE
      - LICENCIA_GRAFICOS.md
      - DERECHOS.md
      - .github/workflows/sincronizar-notas-v1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperar documentación publicada
        uses: actions/checkout@v4

      - name: Actualizar descripción y adjuntar licencias a la Release v1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v1.0
          gh release edit v1.0 --notes-file RELEASE_NOTES.md
          gh release upload v1.0 LICENSE LICENCIA_GRAFICOS.md --clobber
